services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - jarvis-data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/jarvis.db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  jarvis-data:
